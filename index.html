<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drill</title>
<style>
  :root{
    --ink:#16202b; --muted:#5d6b7a; --line:#e2e8ef; --bg:#f4f6f9; --card:#fff;
    --brand:#1f5fd0; --brand-dark:#174aa3; --ok:#12824a; --okbg:#e6f6ec; --bad:#c42a2a; --badbg:#fdeaea;
    --warn:#9a6700; --warnbg:#fff6e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 72px}
  .topbar{background:var(--brand);color:#fff;padding:16px 16px 14px}
  .topbar .inner{max-width:1180px;margin:0 auto}
  .topbar h1{margin:0;font-size:1.12rem;letter-spacing:.2px}
  .topbar p{margin:3px 0 0;font-size:.82rem;opacity:.9}
  .card.narrow{max-width:860px;margin-left:auto;margin-right:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0;
    box-shadow:0 1px 2px rgba(16,24,40,.04)}
  h2{font-size:1.18rem;margin:0 0 4px}
  h3{font-size:1rem;margin:22px 0 10px}
  .sub{color:var(--muted);font-size:.86rem;margin:0}
  .badge{display:inline-block;background:#eaf1fd;color:var(--brand-dark);font-weight:700;
    font-size:.74rem;letter-spacing:.6px;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  label.fld{display:block;font-weight:600;font-size:.86rem;margin:14px 0 6px}
  input[type=text]{width:100%;padding:12px 13px;font-size:1rem;border:1px solid #c9d3df;border-radius:10px;
    font-family:inherit;background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  button{font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;border-radius:10px;
    padding:13px 20px;border:1px solid transparent;background:var(--brand);color:#fff}
  button:hover{background:var(--brand-dark)}
  button.ghost{background:#fff;color:var(--brand-dark);border-color:#c9d3df}
  button.ghost:hover{background:#f0f4fa}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .passage{font-family:Georgia,"Times New Roman",serif;font-size:1.03rem;line-height:1.95;
    background:#fcfcfd;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0 6px}
  .passage p{margin:0 0 14px;text-indent:1.6em}
  .passage p:last-child{margin-bottom:0}
  .passage .ptitle{text-align:center;text-indent:0;font-weight:700;margin-bottom:16px;font-size:1.08rem}
  .blk{display:inline-block;min-width:88px;border-bottom:2px solid #9aa7b6;text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.84rem;
    font-weight:700;color:var(--brand-dark);padding:0 6px;line-height:1.2;vertical-align:baseline}
  .blk.ex{color:var(--ok);border-bottom-color:var(--ok)}
  .blk.filled{border-bottom-color:var(--brand);background:#eaf1fd;border-radius:4px 4px 0 0}
  .blk.bad{color:var(--bad);border-bottom-color:var(--bad);background:#fdeaea;border-radius:4px 4px 0 0}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:16px;align-items:start}
  .pane{border:1px solid var(--line);border-radius:12px;background:#fcfcfd;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .panehead{flex:none;background:#f0f4fa;border-bottom:1px solid var(--line);padding:9px 14px;font-size:.76rem;
    font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
  .panehead .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;font-size:.72rem;opacity:.85}
  .panebody{overflow-y:auto;overscroll-behavior:contain;padding:14px 16px;height:clamp(340px,64vh,700px);
    -webkit-overflow-scrolling:touch;scrollbar-gutter:stable}
  .split .pane:nth-child(2) .panebody{background:#fff}
  .panebody::-webkit-scrollbar{width:10px}
  .panebody::-webkit-scrollbar-thumb{background:#c7d2e0;border-radius:8px;border:2px solid #fff}
  .panebody::-webkit-scrollbar-track{background:transparent}
  .pane .passage{border:0;background:transparent;padding:0;margin:0;border-radius:0}
  .pane .q:first-of-type{margin-top:0}
  .blk[id]{cursor:pointer}
  .blk[id]:hover{background:#dce7fb;border-bottom-color:var(--brand)}
  .q.flash{outline:2px solid var(--brand);outline-offset:2px}
  @media(max-width:900px){
    .split{grid-template-columns:1fr}
    .panebody{height:auto;max-height:48vh}
    .split .pane:nth-child(2) .panebody{max-height:none}
  }
  .why{margin-top:11px;border-top:1px dashed #cdd8e5;padding-top:9px}
  .why summary{cursor:pointer;font-size:.8rem;font-weight:700;color:var(--brand-dark);list-style:none;
    display:inline-block;padding:4px 11px;background:#eaf1fd;border:1px solid #c3d6f7;border-radius:999px}
  .why summary::-webkit-details-marker{display:none}
  .why summary::before{content:"\203A  "}
  .why[open] summary::before{content:"\2039  "}
  .why[open] summary{background:#dce7fb}
  .whybody{margin-top:9px;font-size:.87rem;line-height:1.62}
  .wl{margin:0 0 7px}
  .wl:last-child{margin-bottom:0}
  .wl.trap{color:#8c2d2d}
  .wl.keyline{color:#0d6b3f}
  .wl.kata{background:#fff8e1;border:1px solid #f0d99a;border-radius:8px;padding:7px 10px;
    color:#6b4e00;font-size:.84rem}
  .wl i{font-style:italic;font-weight:600}
  .omy{font-size:.76rem;font-weight:600;color:#9a6700;line-height:1.3}
  .opt.key .omy{color:#0d6b3f}
  .opt.miss .omy{color:#a33}
  .gw{border-bottom:1px dotted var(--brand);background:#f1f6ff;cursor:pointer;border-radius:2px}
  .gw:active{background:#dce7fb}
  #tip{position:fixed;z-index:60;display:none;max-width:250px;background:#16202b;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.84rem;
    line-height:1.4;font-weight:600;padding:8px 12px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #tip b{color:#9ec5ff}
  .bmbtn{display:inline-block;margin-left:5px;padding:1px 8px;font-size:.66rem;font-weight:800;
    letter-spacing:.4px;color:var(--warn);background:#fff6e0;border:1px solid #f0d99a;border-radius:999px;
    cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    vertical-align:middle;text-indent:0;user-select:none}
  .bmbtn:hover{background:#ffeec2}
  .bm{display:none;margin:4px 0 16px;padding:10px 13px;background:#fff8e1;border-left:3px solid #f0b429;
    border-radius:0 9px 9px 0;font-size:.95rem;line-height:1.72;color:#4a3a00;text-indent:0}
  .bm.show{display:block}
  .bm .lbl{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:.66rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#9a6700;margin-bottom:4px}
  .sw{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:.7rem;font-weight:800;
    text-transform:none;letter-spacing:0;background:#fff;border:1px solid #c9d3df;border-radius:999px;
    padding:3px 10px;color:var(--muted);user-select:none;white-space:nowrap}
  .sw.on{background:#e6f6ec;border-color:#9bd4b0;color:var(--ok)}
  .suprow{display:flex;align-items:flex-start;gap:12px;background:#f7f9fc;border:1px solid var(--line);
    border-radius:11px;padding:13px 15px;margin-top:18px;cursor:pointer}
  .suprow.on{background:#e6f6ec;border-color:#9bd4b0}
  .suprow .txt{font-size:.85rem;color:var(--muted)}
  .suprow .txt b{display:block;color:var(--ink);font-size:.93rem;margin-bottom:2px}
  .suprow .box{flex:none;width:22px;height:22px;border:2px solid #c9d3df;border-radius:6px;background:#fff;
    margin-top:2px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .suprow.on .box{background:var(--ok);border-color:var(--ok)}
  .q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
  .q.example{background:#f6fbf7;border-color:#bfe4cd}
  .q.unanswered{border-color:#f0b429;background:var(--warnbg)}
  .q.right{border-color:#bfe4cd;background:var(--okbg)}
  .q.wrong{border-color:#f3c2c2;background:var(--badbg)}
  .qhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;margin-bottom:8px}
  .qnum{background:var(--brand);color:#fff;min-width:30px;height:26px;border-radius:7px;
    display:inline-flex;align-items:center;justify-content:center;font-size:.82rem}
  .q.example .qnum{background:var(--ok)}
  .mark{margin-left:auto;font-size:.82rem;font-weight:700}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  @media(max-width:560px){.opts{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:9px;border:1px solid #d7dfe9;border-radius:9px;
    padding:11px 12px;cursor:pointer;background:#fff;font-size:.95rem;min-height:46px}
  .opt:hover{border-color:var(--brand);background:#f7faff}
  .opt input{margin:0;accent-color:var(--brand);width:17px;height:17px;flex:none}
  .opt .ltr{font-weight:700;color:var(--muted);min-width:14px}
  .opt.sel{border-color:var(--brand);background:#eaf1fd;box-shadow:inset 0 0 0 1px var(--brand)}
  .opt.key{border-color:var(--ok);background:var(--okbg);box-shadow:inset 0 0 0 1px var(--ok)}
  .opt.miss{border-color:var(--bad);background:var(--badbg);box-shadow:inset 0 0 0 1px var(--bad)}
  .opt.locked{cursor:default}
  .opt .tag{margin-left:auto;font-size:.72rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .opt.key .tag{color:var(--ok)} .opt.miss .tag{color:var(--bad)}
  .banner{border-radius:12px;padding:16px 18px;margin:16px 0 4px;border:1px solid}
  .banner.ok{background:var(--okbg);border-color:#bfe4cd}
  .banner.mid{background:var(--warnbg);border-color:#f0d99a}
  .banner.low{background:var(--badbg);border-color:#f3c2c2}
  .banner .big{font-size:1.7rem;font-weight:800;line-height:1.2}
  .banner .msg{font-size:.92rem;margin-top:2px}
  .note{background:var(--warnbg);border:1px solid #f0d99a;color:#6b4e00;border-radius:10px;
    padding:11px 13px;font-size:.88rem;margin-top:14px}
  .prog{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
  .pill{flex:1 1 0;min-width:56px;text-align:center;font-size:.74rem;font-weight:700;padding:7px 4px;
    border-radius:8px;background:#e9edf3;color:var(--muted);border:1px solid var(--line)}
  .pill.now{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pill.done{background:var(--okbg);color:var(--ok);border-color:#bfe4cd}
  table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line)}
  th{background:#f7f9fc;font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  td.num,th.num{text-align:right;white-space:nowrap}
  tr.total td{font-weight:800;background:#f7f9fc;border-bottom:none;font-size:1rem}
  .wrongitem{border:1px solid #f3c2c2;background:#fffafa;border-radius:10px;padding:12px 14px;margin:9px 0}
  .wrongitem .wh{font-weight:700;font-size:.85rem;color:var(--bad);margin-bottom:5px}
  .wrongitem .ctx{font-family:Georgia,serif;font-size:.95rem;color:#2c3a49;margin-bottom:7px}
  .wrongitem .ctx b{background:#ffe9a8;padding:0 4px;border-radius:3px;font-style:normal}
  .wrongitem .cmp{font-size:.9rem}
  .wrongitem .cmp span.y{color:var(--bad);font-weight:700}
  .wrongitem .cmp span.c{color:var(--ok);font-weight:700}
  .allright{background:var(--okbg);border:1px solid #bfe4cd;border-radius:10px;padding:16px;text-align:center;font-weight:700;color:var(--ok)}
  .idline{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);margin-top:6px}
  .idline b{color:var(--ink)}
  .foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:20px}
  .instr{font-size:.9rem;margin:8px 0 0;color:#2c3a49;font-style:italic}
  .blk.ins{display:inline;min-width:0;text-align:left;font-family:inherit;font-size:inherit;font-weight:400;
    color:#123a7a;background:#eaf1fd;border-bottom:2px solid var(--brand);padding:1px 4px;border-radius:4px 4px 0 0;
    line-height:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .blk.ins .bltr{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:.8rem;margin-right:3px}
  .blk.ins.ex{background:var(--okbg);border-bottom-color:var(--ok);color:#0d4f2f}
  .blk.ins.bad{background:var(--badbg);border-bottom-color:var(--bad);color:#7a1d1d}
  .blk.ins.altb,.blk.altb{background:var(--warnbg);border-bottom-color:#e0b44a;color:#6b4e00}
  .bankbox{border:1px solid var(--line);border-radius:12px;background:#f7f9fc;padding:10px 12px;margin-bottom:12px}
  .bankbox h4{margin:0 0 6px;font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .bs{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px dashed #dbe3ec;font-size:.93rem;line-height:1.45}
  .bs:last-child{border-bottom:0}
  .bs .bl{flex:none;width:28px;height:28px;border-radius:7px;background:#fff;border:1px solid #c9d3df;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:.86rem;color:var(--brand-dark)}
  .bs .bt{flex:1;min-width:0}
  .bs.used .bt{color:#8592a0}
  .bs.used .bl{background:var(--brand);color:#fff;border-color:var(--brand)}
  .bs .ut{flex:none;font-size:.7rem;font-weight:800;color:var(--brand-dark);align-self:center;white-space:nowrap}
  .bs .ut:empty{display:none}
  .bs .ut.ok,.bs .ut.xt{border-radius:999px;padding:2px 9px}
  .bs .ut.ok{background:var(--okbg);color:var(--ok);border:1px solid #bfe4cd}
  .bs .ut.xt{background:#eef1f5;color:var(--muted);border:1px solid var(--line)}
  .chips{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
  @media(max-width:560px){.chips{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .chip{position:relative;padding:0;min-height:46px;font-size:1.02rem;font-weight:800;background:#fff;color:var(--ink);
    border:1px solid #d7dfe9;border-radius:9px}
  .chip:hover{background:#f7faff;border-color:var(--brand)}
  .chip.sel,.chip.sel:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip.taken{background:#f1f3f6;color:#9aa5b1;border-style:dashed}
  .chip .on{position:absolute;top:2px;right:5px;font-size:.6rem;font-weight:700;color:#7b8794}
  .chip.key,.chip.key:hover{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
  .chip.miss,.chip.miss:hover{background:var(--badbg);border-color:var(--bad);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
  .chip.altk,.chip.altk:hover{background:var(--warnbg);border-color:#e0b44a;color:var(--warn);box-shadow:inset 0 0 0 1px #e0b44a}
  .chip:disabled{opacity:1;cursor:default}
  .chip.dim:disabled{opacity:.45}
  .pick{margin-top:9px;font-size:.9rem;color:var(--muted);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
  .pick b{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--brand-dark)}
  .pick .y{color:var(--bad)} .pick .c{color:var(--ok)}
  .q.altq{border-color:#f0d99a;background:var(--warnbg)}
  .mark.alt{color:var(--warn)}
  .wl.alt{background:#fff3d6;border:1px solid #f0d99a;border-radius:8px;padding:7px 10px;color:#6b4e00}
  .wrongitem .cmp i{font-family:Georgia,serif;font-style:normal;color:#2c3a49}

  /* ---- v1.2 maybes (tap once) / answer (tap twice) / proof words ---- */
  .legend{margin:0 0 10px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:.82rem;color:var(--muted)}
  .legend b{color:var(--ink)}
  .lg{display:inline-block;min-width:22px;text-align:center;font-weight:800;border-radius:5px;padding:0 4px;font-size:.78rem}
  .lg.m{background:#fff6cc;border:1px dashed #b38f00;color:#7a5d00}
  .lg.p{background:var(--brand);border:1px solid var(--brand);color:#fff}
  .chip.cand{border:1px dashed #b38f00;background:#fff6cc;color:#7a5d00}
  .chip.cand::before{content:"?";position:absolute;bottom:2px;left:6px;font-size:.6rem;font-weight:800;color:#b38f00}
  .chip.cand.elim{text-decoration:line-through;color:#c0392b;background:#f6f2e6}
  .chip.wm{outline:2px dashed #d4b44a;outline-offset:-5px}
  .pick .one{color:#6b4e00;background:#fff3d6;border:1px solid #f0d99a;border-radius:7px;padding:3px 8px;display:inline-block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.84rem}
  .pick .zero{color:var(--bad);background:var(--badbg);border:1px solid #f1b9b3;border-radius:7px;padding:3px 8px;display:inline-block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.84rem}
  .pmk{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.78rem;font-weight:700;color:#8a6d00;background:#fff6cc;border:1px dashed #d4b44a;border-radius:6px;padding:0 6px;white-space:nowrap}
  .pmk s{color:#c0392b}
  input.proof{margin-top:8px;width:100%;font-size:.88rem;padding:8px 10px;border:1px dashed #c9d3df;border-radius:8px;background:#fbfcfe}
  input.proof:focus{border-style:solid;border-color:var(--brand);outline:0;background:#fff}
  .proofv{margin-top:8px;font-size:.86rem;color:#2c3a49}
  .rpx{font-size:.86rem;margin-top:5px;color:#2c3a49}
  .prt td:nth-child(4){font-family:Georgia,serif}
  .prt .pc{color:var(--ok)} .prt .py{color:var(--bad)}
  .blk.prev{display:inline;min-width:0;text-align:left;font-family:inherit;font-size:inherit;font-weight:400;background:#fffbea;border:0;border-bottom:2px dashed #c9a227;border-radius:4px 4px 0 0;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .blk.prev:hover{background:#fff3c4;border-bottom-color:#b38f00}
  .pvh{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.78rem;font-weight:800;color:#7a5d00;white-space:nowrap}
  .pvb{display:inline-block;text-indent:0;min-width:26px;min-height:22px;line-height:20px;text-align:center;margin:0 2px;padding:1px 6px;border-radius:6px;border:1px dashed #b38f00;background:#fff;color:#7a5d00;cursor:pointer}
  .pvb.on{background:#b38f00;border-style:solid;color:#fff}
  .pvb.out{text-decoration:line-through;color:#c0392b;border-color:#e3c9c5;cursor:default;opacity:.7}
  .pvs{font-style:italic;color:#5a4600;font-family:Georgia,"Times New Roman",serif;font-weight:400}
  .hlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0 0;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:.82rem;color:var(--muted)}
  .hlbar b{color:var(--ink)}
  .hlclr{min-height:32px;padding:4px 12px;font-size:.8rem}
  .w.hl{background:#fff176;box-shadow:2px 0 0 #fff176,-2px 0 0 #fff176;cursor:pointer}
  .w{-webkit-tap-highlight-color:transparent}
  .bs{flex-wrap:wrap}
  .qn{flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px 38px}
  .qb{min-width:40px;min-height:34px;padding:0 8px;border-radius:8px;border:1px solid #c9d3df;background:#fff;color:var(--muted);font-size:.84rem;font-weight:800;box-shadow:none;cursor:pointer}
  .qb:hover{border-color:var(--brand);color:var(--brand-dark);background:#f7faff}
  .qb.cand{border:1px dashed #b38f00;background:#fff6cc;color:#7a5d00}
  .qb.cand.elim{text-decoration:line-through;color:#c0392b;background:#f6f2e6}

   Saved per unit. Flag: CONFIG.highlighter (default true).
   GAP NUMBERS under each bank sentence (27 28 29 ...) do exactly what the
   letter buttons in the gap cards do, so students can assign from the bank
   without scrolling. Both sides stay in sync.
   Flags: CONFIG.pencil (maybes, default true), CONFIG.proofWords (default true).

   WHY ONE FILE: a separate content.json cannot be fetched from a file:// page

   ---------------------------------------------------------------- SCHEMA ----
   CONFIG   : titles, instructions, unit word, storage key, feature flags.

   OPT      : CLASSIC { setId: { qNo: ["makna A","makna B","makna C","makna D"] } }

                glossing only the key hands students the answer. Omit pure
                grammar-form items (offer/offers/offered).
   --------------------------------------------------------------------------

   ==== CONTENT BLOCK -- EDIT FROM HERE ===================================== */

const LTR = "ABCDEFGH".split("");
const KEY = CONFIG.storageKey;
const U = CONFIG.unit;
const FITS = (typeof FIT !== "undefined") ? FIT : {};
const isBank = set => Array.isArray(set.bank);
const QS = set => set.qs.map(q => isBank(set)
  ? { n:q[0], opts:set.bank, key:q[1], alt:(q[2] === undefined ? null : q[2]) }
  : { n:q[0], opts:q[1],     key:q[2], alt:(q[3] === undefined ? null : q[3]) });
const qOf = (set,n) => QS(set).find(x=>x.n===n);
const marksOf = set => set.qs.filter(q=>q[0]!==0).length;
const TOTAL = SETS.reduce((a,s)=>a+marksOf(s), 0);
const HAS_EX = SETS.some(s=>s.qs.some(q=>q[0]===0));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = s => esc(s).replace(/\*([^*]+)\*/g, "<i>$1</i>");
const PENCIL = CONFIG.pencil !== false;       /* v1.2: sudoku-style pencil grid on BANK units */
const PROOF  = CONFIG.proofWords !== false;   /* v1.2: optional proof-word box per gap        */

const HAS_BANK = SETS.some(isBank);

/* option / sentence gloss -- all-or-none is enforced here, not just documented */
function optGloss(set, i, n){
  const o = OPT[String(set.id)]; if(!o) return null;
  const arr = isBank(set) ? o.bank : o[String(n)];
  const want = isBank(set) ? set.bank.length : (qOf(set,n) || {opts:[]}).opts.length;
  if(!Array.isArray(arr) || arr.length !== want || arr.some(x=>!x)) return null;
  return arr[i];
}

/* ---------- Malay glossary: single-pass wrap so inserted markup is never re-matched ---------- */
let GRE = null;
function gre(){
  if(GRE) return GRE;
  const keys = Object.keys(GLOSS).sort((a,b)=>b.length-a.length)
    .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  GRE = keys.length ? new RegExp("\\b(" + keys.join("|") + ")\\b","gi") : /$^/;
  return GRE;
}
function glossify(t){
  return t.replace(gre(), m=>{
    const v = GLOSS[m.toLowerCase()];
    if(!v) return m;
    return '<span class="gw" data-m="' + v.replace(/"/g,"&quot;") + '">' + m + '</span>';
  });
}

/* ---------- explanation block (G8: kill the distractor, then secure the key) ---------- */
function expBlock(setId, n, picked, open){
  if(!CONFIG.explanations) return "";
  const set = SETS.find(x=>x.id===setId);
  const q = qOf(set, n);
  const bank = isBank(set);
  const e = (EXP[String(setId)] || {})[String(n)] || null;
  const lab = i => bank ? LTR[i] : LTR[i] + ' (' + esc(q.opts[i]) + ')';
  let trap = "";
  if(picked !== null && picked !== undefined && picked !== q.key){
    if(e && e.no) trap = Array.isArray(e.no) ? (e.no[picked] || "") : (e.no[LTR[picked]] || "");
    if(!trap && bank) trap = (FITS[String(setId)] || {})[LTR[picked]] || "";
  }
  if(!e && !trap) return "";
  let h = '<details class="why"'+(open?" open":"")+'><summary>Why? &middot; Kenapa?</summary><div class="whybody">';
  if(q.alt !== null && picked === q.alt){
    h += '<p class="wl alt">\u2696\uFE0F <b>Defensible answer.</b> Your choice can be argued, so check your teacher\u2019s key. '
       + 'The notes below explain why this key prefers ' + LTR[q.key] + '.</p>';
  }
  if(trap) h += '<p class="wl trap">\u2702\uFE0F <b>Why ' + lab(picked) + (q.alt === picked ? ' is weaker' : ' fails') + ':</b> ' + fmt(trap) + '</p>';
  if(e && e.k) h += '<p class="wl keyline">\u2705 <b>Why ' + lab(q.key) + ' wins:</b> ' + fmt(e.k) + '</p>';
  if(e && e.g) h += '<p class="wl kata">\uD83D\uDCD6 <b>Kata kunci:</b> ' + fmt(e.g) + '</p>';
  return h + '</div></details>';
}

function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

/* ---------- v1.2 pencil marks + proof words (student-made only: nothing here reads the key) ---------- */
const candOf  = (sid,n) => ((S.pencil[sid] || {})[n] || []).slice().sort((a,b)=>a-b);
const proofOf = (sid,n) => ((S.proof[sid] || {})[n] || "").trim();
function toggleCand(sid,n,i){
  S.pencil[sid] = S.pencil[sid] || {};
  const a = S.pencil[sid][n] || [];
  const k = a.indexOf(i);
  if(k > -1) a.splice(k,1); else a.push(i);
  if(a.length) S.pencil[sid][n] = a; else delete S.pencil[sid][n];
}
const emptyHint = n => PENCIL ? 'Tap a letter once for a maybe, twice to answer.'
  : 'Tap a letter to put that sentence in gap ' + n + '.';
/* status line under an unanswered gap: maybes, "only one left", or "none left" */
function maybeHint(sid, n, owner){
  const c = candOf(sid,n);
  if(!PENCIL || !c.length) return emptyHint(n);
  const live = c.filter(i=>owner[i] === undefined || owner[i] === n);
  if(live.length === 1) return '<span class="one">\u26A1 Only <b>' + LTR[live[0]] + '</b> is left of your maybes. It is shown in the passage. Found the proof word? Tap ' + LTR[live[0]] + ' again to answer.</span>';
  if(live.length === 0) return '<span class="zero">\u26D4 Your maybes are all used in other gaps. Recheck those answers.</span>';
  const pv = previewOf(sid, n, owner);
  return '\u270F\uFE0F Maybes: <b>' + live.map(i=>LTR[i]).join(' \u00B7 ') + '</b>. '
       + (pv !== null ? 'Trying <b>' + LTR[pv] + '</b> in the passage (tap the letters in the gap to swap). ' : '')
       + 'Tap one again here to answer.';
}
/* which maybe is shown in the blank: the one the student picked, else the newest live one */
function previewOf(sid, n, owner){
  const raw = (S.pencil[sid] || {})[n] || [];
  const live = raw.filter(i=>owner[i] === undefined);
  if(!live.length) return null;
  const want = (S.preview[sid] || {})[n];
  return live.indexOf(want) > -1 ? want : live[live.length-1];
}
function paintPreview(set, n, owner){
  const el = document.getElementById('blk-'+set.id+'-'+n);
  if(!el) return false;
  const pv = previewOf(set.id, n, owner);
  if(pv === null) return false;
  const c = candOf(set.id, n);
  const tabs = c.map(i=>{
    const out = owner[i] !== undefined && owner[i] !== n;
    return out ? '<span class="pvb out">' + LTR[i] + '</span>'
               : '<span class="pvb' + (i === pv ? ' on' : '') + '" data-q="'+n+'" data-i="'+i+'" title="Try ' + LTR[i] + ' in this gap">' + LTR[i] + '</span>';
  }).join("");
  el.className = 'blk prev';
  el.innerHTML = '<span class="pvh">(' + n + ') \u270F\uFE0F ' + tabs + '</span> <span class="pvs">' + esc(set.bank[pv]) + '</span>';
  return true;
}
function pencilTag(sid, n, owner){
  const c = candOf(sid,n);
  if(!c.length) return "";
  return ' <span class="pmk" title="Your maybes">\u270F\uFE0F ' + c.map(i=>{
    const out = owner && owner[i] !== undefined && owner[i] !== n;
    return out ? '<s>' + LTR[i] + '</s>' : LTR[i];
  }).join(" \u00B7 ") + '</span>';
}

/* ---------- context extraction for the mistake report ---------- */
function contextFor(set, n){
  const para = set.paras.find(p => p.indexOf("{{"+n+"}}") > -1) || "";
  const parts = para.split("{{"+n+"}}");
  const before = parts[0].replace(/\{\{\d+\}\}/g, "\u2026").trim().split(/\s+/).filter(Boolean);
  const after  = (parts[1]||"").replace(/\{\{\d+\}\}/g, "\u2026").trim().split(/\s+/).filter(Boolean);
  const W = isBank(set) ? 14 : 9;
  const L = before.slice(-W).join(" ");
  const R = after.slice(0, W).join(" ");
  return (before.length > W ? "\u2026 " : "") + esc(L) + " <b>(" + n + ") ____</b> " + esc(R) + (after.length > W ? " \u2026" : "");
}

/* ---------- passage blanks ---------- */
function blankHTML(set, n, i){
  if(isBank(set)) return '<span class="bltr">(' + n + ') ' + LTR[i] + '</span>' + esc(set.bank[i]);
  return '(' + n + ') ' + esc(qOf(set,n).opts[i]);
}
function paintBlank(set, n, i, cls, marks){
  const el = document.getElementById('blk-'+set.id+'-'+n);
  if(!el) return;
  if(i === null || i === undefined){ el.className = 'blk'; el.innerHTML = '(' + n + ') ______' + (marks || ""); return; }
  el.innerHTML = blankHTML(set, n, i);
  el.className = 'blk ' + (isBank(set) ? 'ins ' : '') + cls;
}

/* ---------- rendering ---------- */
function progressBar(){
  return '<div class="prog">' + SETS.map((s,i)=>{
    const cls = S.sets[s.id] ? "done" : (i === S.idx && !S.done ? "now" : "");
    const tick = S.sets[s.id] ? " \u2713" : "";
    return '<div class="pill '+cls+'">'+U+' '+s.id+tick+'</div>';
  }).join("") + '</div>';
}

function renderStart(){
  const instr = CONFIG.instructions ||
    'Read each passage and choose the <b>best</b> answer <b>A</b>, <b>B</b>, <b>C</b> or <b>D</b> for every blank.';
  document.getElementById("app").innerHTML =
  '<div class="card narrow">'
  + '<h2>' + esc(CONFIG.startHeading) + '</h2>'
  + '<p class="sub">' + SETS.length + ' ' + CONFIG.units + ' &middot; ' + marksOf(SETS[0])
  + ' questions each &middot; ' + TOTAL + ' marks total</p>'
  + '<p style="font-size:.93rem;margin:16px 0 0">' + instr
  + (HAS_EX ? ' Question <b>(0)</b> is done for you as an example and is not marked.' : '') + '</p>'
  + ((HAS_BANK && PENCIL) ? '<p style="font-size:.93rem;margin:10px 0 0">\u270F\uFE0F <b>Not sure yet?</b> Tap a letter <b>once</b> to mark it as a maybe, like scribbling on the exam paper. '
     + 'Tap it <b>again</b> to make it your answer. Your maybes appear in the gap so you can compare them, and once a sentence is an answer, it is crossed out as a maybe in the other gaps. Only answers are scored.</p>' : '')
  + (HILITE ? '<p style="font-size:.93rem;margin:10px 0 0">\uD83D\uDD8D\uFE0F <b>Highlight clues</b> in the passage and the sentences: drag across words or double-click one. Tap a highlight to remove it.</p>' : '')
  + '<p style="font-size:.93rem;margin:10px 0 0">Submit a ' + U.toLowerCase() + ' to see your score and the correct answers. '
  + 'After all ' + SETS.length + ' ' + CONFIG.units + ' you get a full report card with every question you got wrong.</p>'
  + '<label class="fld" for="cl">Your class</label><select id="cl"><option value="">Choose your class</option></select>'
  + '<label class="fld" for="nm">Your name</label><select id="nm" disabled><option value="">Choose your class first</option></select>'
  + '<p class="roster-note">Choose only your own name. Your teacher receives your answers and scores with an automatic timestamp. This is practice, not an official exam.</p>'
  + '<p class="roster-note">'+esc(rosterError || (roster.length ? 'Roster connected. Missing name? Ask your teacher to update the roster.' : 'Loading roster…'))+'</p>'
  + (CONFIG.supportMode ? '<div class="suprow' + (S.support?" on":"") + '" id="suprow"><div class="box">' + (S.support?"\u2713":"") + '</div>'
  + '<div class="txt"><b>\uD83C\uDDF2\uD83C\uDDFE Bantuan Bahasa Melayu (support mode)</b>'
  + 'Turn this on to translate any paragraph into Malay and tap difficult words for their meaning. '
  + 'Leave it off for real exam conditions. You can switch it anytime.</div></div>' : '')
  + '<div id="warn"></div>'
  + '<div class="btnrow"><button id="go">Start ' + U + ' ' + SETS[0].id + ' &rarr;</button></div>'
  + '</div>';
  const nm = document.getElementById("nm"), cl = document.getElementById("cl");
  [...new Set(roster.map(r=>r.klass))].sort().forEach(c=>cl.add(new Option(c,c)));
  cl.value = S.klass || '';
  function fillNames(){
    nm.replaceChildren(new Option(cl.value ? 'Choose your name' : 'Choose your class first',''));
    roster.filter(r=>r.klass===cl.value).sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>nm.add(new Option(r.name,r.id)));
    nm.disabled=!cl.value; if(S.studentId)nm.value=S.studentId;
  }
  fillNames();cl.onchange=()=>{S.klass=cl.value;S.name='';S.studentId='';fillNames();};
  nm.onchange=()=>{const r=roster.find(r=>r.id===nm.value&&r.klass===cl.value);S.studentId=r?.id||'';S.name=r?.name||'';};
  const suprow = document.getElementById("suprow");
  if(suprow) suprow.onclick = ()=>{S.support=!S.support;renderStart();};
  if(!CONFIG.supportMode) S.support=false;
  document.getElementById("go").disabled=!roster.length;
  document.getElementById("go").onclick = ()=>{
    const r=roster.find(r=>r.id===nm.value&&r.klass===cl.value);
    if(!r){document.getElementById("warn").innerHTML='<div class="note">Please choose your class and your own name first.</div>';return;}
    S.studentId=r.id;S.name=r.name;S.klass=r.klass;ensureAttempt();save();render();
  };
  paintSync();
}

function renderSet(){
  const set = SETS[S.idx];
  const bank = isBank(set);
  const saved = S.sets[set.id] || null;
  const locked = !!saved;
  const qs = QS(set);

  let html = '<div class="card">' + progressBar()
    + '<div style="margin-top:16px"><span class="badge">' + U + ' ' + set.id + '</span></div>'
    + '<h2 style="margin-top:8px">' + esc(set.title) + '</h2>'
    + '<p class="sub">' + esc(CONFIG.questionRange) + ' &middot; ' + marksOf(set) + ' marks'
    + (bank ? ' &middot; ' + (set.bank.length - marksOf(set)) + ' extra sentences' : '') + '</p>'
    + (set.intro ? '<p class="instr">' + esc(set.intro) + '</p>' : '')
    + (HILITE ? '<div class="hlbar no-print"><span>\uD83D\uDD8D\uFE0F <b>Highlight clues:</b> drag across words, or double-click one. Tap a highlight to remove it.</span>'
              + '<button type="button" class="ghost hlclr" id="hlclr">Clear highlights</button></div>' : '');

  /* ---- left pane: passage ---- */
  html += '<div class="split">'
       +  '<div class="pane"><div class="panehead">Passage'
       +  (CONFIG.supportMode
             ? '<span class="sw' + (S.support?" on":"") + '" id="supsw">\uD83C\uDDF2\uD83C\uDDFE BM '
               + (S.support?"on":"off") + '</span>'
             : '<span class="hint">tap a gap to jump &rarr;</span>') + '</div>'
       +  '<div class="panebody" id="ppane">';
  html += '<div class="passage"><p class="ptitle">' + esc(set.title) + '</p>';
  set.paras.forEach((p,pi)=>{
    let t = esc(p);
    if(S.support) t = glossify(t);
    t = t.replace(/\{\{(\d+)\}\}/g, (m,n)=>{
      n = +n;
      if(n === 0){
        const q = qOf(set,0);
        return '<span class="blk ex">' + blankHTML(set, 0, q.key) + '</span>';
      }
      return '<span class="blk" id="blk-'+set.id+'-'+n+'">(' + n + ') ______</span>';
    });
    html += '<p data-hk="p'+pi+'">' + t + (S.support ? ' <span class="bmbtn" data-p="'+pi+'">BM</span>' : '') + '</p>';
    if(S.support && TRANS[set.id] && TRANS[set.id][pi]){
      const op = (S.unlocked[set.id] || []).indexOf(pi) > -1;
      html += '<div class="bm' + (op?" show":"") + '" id="bm-'+set.id+'-'+pi+'">'
            + '<span class="lbl">Terjemahan &middot; perenggan ' + (pi+1) + '</span>'
            + esc(TRANS[set.id][pi]) + '</div>';
    }
  });
  html += '</div></div></div>';

  /* ---- right pane: answers ---- */
  html += '<div class="pane"><div class="panehead">'
       +  (bank ? 'Answers &middot; one sentence per gap' : 'Answers &middot; choose A, B, C or D')
       +  '<span class="hint" id="count"></span></div>'
       +  '<div class="panebody" id="qpane">';

  if(bank){
    html += '<div class="bankbox"><h4>Sentences A\u2013' + LTR[set.bank.length-1] + '</h4>';
    set.bank.forEach((s,i)=>{
      const g = S.support ? optGloss(set, i, null) : null;
      let ut;
      if(locked){
        const home = qs.find(x=>x.key===i);
        ut = home ? '<span class="ut ok">Gap ' + home.n + '</span>' : '<span class="ut xt">Extra</span>';
      } else ut = '<span class="ut" id="ut-'+set.id+'-'+i+'"></span>';
      const qrow = locked ? '' : '<div class="qn" aria-label="Put sentence ' + LTR[i] + ' in a gap">'
            + qs.filter(x=>x.n !== 0).map(x=>'<button type="button" class="qb" data-q="'+x.n+'" data-i="'+i+'" aria-label="Sentence '+LTR[i]+' for gap '+x.n+'">'+x.n+'</button>').join("")
            + '</div>';
      html += '<div class="bs" id="bs-'+set.id+'-'+i+'"><span class="bl">' + LTR[i] + '</span>'
            + '<div class="bt" data-hk="b'+i+'">' + esc(s) + (g ? '<br><span class="omy">' + esc(g) + '</span>' : '') + '</div>' + ut + qrow + '</div>';
    });
    html += '</div>';
    if(PENCIL && !locked) html += '<div class="legend"><b>Tap a gap number under a sentence, or a letter below:</b> once = <span class="lg m">27</span> maybe &middot; twice = <span class="lg p">27</span> answer &middot; again = clear</div>';
  }

  qs.forEach(q=>{
    const n = q.n, opts = q.opts, key = q.key;
    const isEx = n === 0;
    const draft = (S.draft || {})[set.id] || {};
    const picked = saved ? saved.answers[n] : (n in draft ? draft[n] : null);
    const isAlt = locked && q.alt !== null && picked === q.alt;
    let cls = "q";
    if(isEx) cls += " example";
    else if(locked) cls += (picked === key ? " right" : isAlt ? " altq" : " wrong");
    html += '<div class="'+cls+'" id="q-'+set.id+'-'+n+'">';
    html += '<div class="qhead"><span class="qnum">'+n+'</span>';
    html += isEx ? '<span style="color:#12824a">Example &mdash; not marked</span>'
                 : '<span style="color:#5d6b7a;font-weight:600">' + (bank ? 'Gap' : 'Blank') + ' ('+n+')</span>';
    if(locked && !isEx){
      html += picked === key ? '<span class="mark ok">\u2713 Correct</span>'
            : isAlt ? '<span class="mark alt">\u2248 Defensible &middot; 0 marks on this key</span>'
                    : '<span class="mark bad">\u00D7 Wrong</span>';
    }
    html += '</div>';

    if(bank){
      html += '<div class="chips">' + opts.map((o,i)=>{
        let c = "chip";
        if(isEx || locked){
          if(i === key) c += " key";
          else if(i === picked) c += (i === q.alt ? " altk" : " miss");
          else c += " dim";
        } else if(picked === i) c += " sel";
        if(locked && PENCIL && candOf(set.id,n).indexOf(i) > -1) c += " wm";
        return '<button type="button" class="'+c+'" data-q="'+n+'" data-i="'+i+'"'
             + ((isEx || locked) ? ' disabled' : '') + ' aria-label="Sentence '+LTR[i]+' for gap '+n+'">'
             + LTR[i] + '<span class="on"></span></button>';
      }).join("") + '</div>';
      let pk;
      if(locked && !isEx){
        pk = picked === key
          ? '<b class="c">' + LTR[key] + '</b> ' + esc(opts[key])
          : 'You: <b class="y">' + LTR[picked] + '</b> ' + esc(opts[picked]) + '<br>Key: <b class="c">' + LTR[key] + '</b> ' + esc(opts[key]);
      } else if(isEx){
        pk = '<b>' + LTR[key] + '</b> ' + esc(opts[key]);
      } else pk = emptyHint(n);
      html += '<div class="pick" id="pick-'+set.id+'-'+n+'">' + pk + '</div>';
      if(locked && !isEx && PENCIL && picked !== key && candOf(set.id,n).length)
        html += '<div class="proofv">\u270F\uFE0F Your maybes: <b>' + candOf(set.id,n).map(i=>LTR[i]).join(", ") + '</b>'
              + (candOf(set.id,n).indexOf(key) > -1 ? ' (the key was one of them)' : ' (the key was not one of them)') + '</div>';
      if(PROOF && !isEx){
        if(!locked){
          html += '<input type="text" class="proof" id="pf-'+set.id+'-'+n+'" data-q="'+n+'" maxlength="90" autocomplete="off"'
                + ' placeholder="Proof word (optional), e.g. These = the lamps" value="' + esc(proofOf(set.id,n)).replace(/"/g,"&quot;") + '">';
        } else if(proofOf(set.id,n)){
          html += '<div class="proofv">\uD83D\uDD0E Your proof: <i>' + esc(proofOf(set.id,n)) + '</i></div>';
        }
      }
    } else {
      html += '<div class="opts">';
      opts.forEach((o,i)=>{
        let ocls = "opt", tag = "";
        if(isEx){
          ocls += " locked" + (i === key ? " key" : "");
          if(i === key) tag = '<span class="tag">Answer</span>';
        } else if(locked){
          ocls += " locked";
          if(i === key){ ocls += " key"; tag = '<span class="tag">Answer</span>'; }
          else if(i === picked){ ocls += " miss"; tag = '<span class="tag">' + (isAlt ? 'You &middot; defensible' : 'You') + '</span>'; }
        } else if(picked === i){ ocls += " sel"; }
        const dis = (isEx || locked) ? " disabled" : "";
        const chk = (isEx && i === key) || (i === picked) ? " checked" : "";
        const og = S.support ? optGloss(set, i, n) : null;
        const olab = og ? esc(o) + '<br><span class="omy">' + esc(og) + '</span>' : esc(o);
        html += '<label class="'+ocls+'" data-s="'+set.id+'" data-q="'+n+'" data-i="'+i+'">'
              + '<input type="radio" name="s'+set.id+'q'+n+'" value="'+i+'"'+dis+chk+'>'
              + '<span class="ltr">'+LTR[i]+'</span><span>'+olab+'</span>'+tag+'</label>';
      });
      html += '</div>';
    }
    if(locked && !isEx && picked !== key) html += expBlock(set.id, n, picked, false);
    html += '</div>';
  });

  html += '</div></div></div>';

  html += '<div id="setmsg"></div>';
  html += '<div class="btnrow no-print">';
  if(!locked){
    html += '<button id="submit">Submit ' + U + ' ' + set.id + '</button>';
  } else {
    const last = S.idx === SETS.length - 1;
    html += '<button id="next">' + (last ? 'See my full report \u2192'
          : 'Next: ' + U + ' ' + SETS[S.idx+1].id + ' \u2192') + '</button>';
  }
  html += '</div></div>';

  document.getElementById("app").innerHTML = html;
  if(HILITE) hlSetup(set);

  /* BM support switch (keeps drafted answers, which live in S.draft) */
  const supsw = document.getElementById("supsw");
  if(supsw) supsw.onclick = ()=>{ S.support = !S.support; save(); render(); };

  /* per-paragraph Malay translation toggles */
  document.querySelectorAll(".bmbtn").forEach(b=>{
    b.onclick = ev=>{
      ev.stopPropagation();
      const pi = +b.dataset.p;
      const d = document.getElementById('bm-'+set.id+'-'+pi);
      if(!d) return;
      const now = !d.classList.contains("show");
      d.classList.toggle("show", now);
      S.unlocked[set.id] = S.unlocked[set.id] || [];
      if(now && S.unlocked[set.id].indexOf(pi) < 0) S.unlocked[set.id].push(pi);
      save();
    };
  });

  /* tap a blank in the passage to jump to its question in the right pane */
  document.querySelectorAll('.blk[id]').forEach(b=>{
    b.title = "Jump to this question";
    b.onclick = ev=>{
      if(ev.target && ev.target.closest && ev.target.closest(".gw")) return;
      const n = b.id.split("-")[2];
      const c = document.getElementById('q-'+set.id+'-'+n);
      if(!c) return;
      c.scrollIntoView({behavior:"smooth", block:"center"});
      c.classList.add("flash");
      setTimeout(()=>c.classList.remove("flash"), 1000);
    };
  });

  if(locked){
    qs.forEach(q=>{
      if(q.n === 0) return;
      const p = saved.answers[q.n];
      paintBlank(set, q.n, p, p === q.key ? 'ex' : (q.alt !== null && p === q.alt) ? 'altb' : 'bad');
    });
    const b = document.getElementById("next");
    if(b) b.onclick = ()=>{
      if(S.idx === SETS.length - 1){ S.done = true; } else { S.idx++; }
      save(); render(); window.scrollTo(0,0);
    };
    renderBanner(saved.score, marksOf(set));
    return;
  }

  /* live answering -- drafts persist so toggling BM never wipes picks */
  const picks = Object.assign({}, (S.draft || {})[set.id] || {});
  const keep = ()=>{ S.draft = S.draft || {}; S.draft[set.id] = picks; save(); };
  const updateCount = ()=>{
    const c = document.getElementById("count");
    if(c) c.textContent = Object.keys(picks).length + " / " + marksOf(set) + " answered";
  };

  if(bank){
    const refresh = ()=>{
      const owner = {};
      Object.keys(picks).forEach(m=>{ owner[picks[m]] = +m; });
      qs.forEach(q=>{
        if(q.n === 0) return;
        const p = picks[q.n];
        document.querySelectorAll('.chip[data-q="'+q.n+'"]').forEach(ch=>{
          const i = +ch.dataset.i, own = owner[i];
          const taken = own !== undefined && own !== q.n;
          ch.classList.toggle("sel", p === i);
          ch.classList.toggle("taken", taken);
          const isC = candOf(set.id, q.n).indexOf(i) > -1;
          ch.classList.toggle("cand", isC && p !== i);
          ch.classList.toggle("elim", isC && taken);
          ch.querySelector(".on").textContent = taken ? own : "";
          ch.title = taken ? "Used in gap " + own + (PENCIL ? " \u2014 tap twice to move it here" : " \u2014 tap to move it here")
                   : (isC && p !== i) ? "Maybe \u2014 tap again to answer" : "";
        });
        const pk = document.getElementById('pick-'+set.id+'-'+q.n);
        if(pk) pk.innerHTML = p === undefined ? maybeHint(set.id, q.n, owner)
                                              : '<b>' + LTR[p] + '</b> ' + esc(set.bank[p]);
        if(!(PENCIL && p === undefined && paintPreview(set, q.n, owner)))
          paintBlank(set, q.n, p === undefined ? null : p, 'filled', PENCIL ? pencilTag(set.id, q.n, owner) : "");
        const card = document.getElementById('q-'+set.id+'-'+q.n);
        if(card && p !== undefined) card.classList.remove("unanswered");
        const pf = document.getElementById('pf-'+set.id+'-'+q.n);
        if(pf) pf.style.display = (p !== undefined || pf.value.trim()) ? "" : "none";   /* proof box appears once answered */
      });
      set.bank.forEach((s,i)=>{
        const own = owner[i];
        const u = document.getElementById('ut-'+set.id+'-'+i);
        const bs = document.getElementById('bs-'+set.id+'-'+i);
        if(u) u.textContent = own !== undefined ? "\u2192 Gap " + own : "";
        if(bs) bs.classList.toggle("used", own !== undefined);
        document.querySelectorAll('.qb[data-i="'+i+'"]').forEach(b=>{
          const n = +b.dataset.q, isC = candOf(set.id, n).indexOf(i) > -1;
          const elsewhere = own !== undefined && own !== n;
          b.classList.toggle("sel", picks[n] === i);
          b.classList.toggle("cand", isC && picks[n] !== i);
          b.classList.toggle("elim", isC && elsewhere);
          b.classList.toggle("full", picks[n] !== undefined && picks[n] !== i && !isC);   /* gap already answered with another sentence */
          b.title = picks[n] === i ? LTR[i] + " is your answer for gap " + n + " (tap to clear)"
                  : isC ? "Maybe for gap " + n + " (tap again to answer)"
                  : picks[n] !== undefined ? "Gap " + n + " has " + LTR[picks[n]] + " (tap to try " + LTR[i] + " as a maybe)"
                  : "Tap once: maybe for gap " + n;
        });
      });
      updateCount();
    };
    refresh();
    const addCand = (n,i)=>{ if(candOf(set.id,n).indexOf(i) < 0) toggleCand(set.id,n,i); };
    const dropCand = (n,i)=>{ if(candOf(set.id,n).indexOf(i) > -1) toggleCand(set.id,n,i); };
    const pen = (n,i)=>{
      if(picks[n] === i){ delete picks[n]; }
      else {
        Object.keys(picks).forEach(m=>{ if(picks[m] === i){ delete picks[m]; if(PENCIL) addCand(+m,i); } });  /* one sentence, one gap: move it */
        if(PENCIL && picks[n] !== undefined) addCand(n, picks[n]);   /* the old answer here drops back to a maybe */
        picks[n] = i;
        if(PENCIL) dropCand(n,i);
      }
      keep(); refresh();
    };
    const pp = document.getElementById("ppane");
    if(pp && PENCIL) pp.addEventListener("click", ev=>{
      const t = ev.target.closest && ev.target.closest(".pvb[data-i]");
      if(!t) return;
      ev.stopPropagation(); ev.preventDefault();
      S.preview[set.id] = S.preview[set.id] || {}; S.preview[set.id][+t.dataset.q] = +t.dataset.i;
      save(); refresh();
    }, true);
    const tap = (n,i)=>{
      if(PENCIL){                                      /* blank -> maybe -> answer -> blank */
        if(picks[n] === i){ delete picks[n]; keep(); refresh(); return; }
        if(candOf(set.id,n).indexOf(i) > -1){ pen(n,i); return; }
        toggleCand(set.id,n,i);
        S.preview[set.id] = S.preview[set.id] || {}; S.preview[set.id][n] = i;   /* newest maybe goes in the blank */
        save(); refresh(); return;
      }
      pen(n,i);
    };
    /* same action from either side: letter in a gap card, or gap number under a sentence */
    document.querySelectorAll('.chip:not([disabled]), .qb').forEach(b=>{
      b.addEventListener("click", ()=>tap(+b.dataset.q, +b.dataset.i));
    });
    if(PROOF) document.querySelectorAll("input.proof").forEach(inp=>{
      inp.addEventListener("input", ()=>{
        S.proof[set.id] = S.proof[set.id] || {};
        if(inp.value.trim()) S.proof[set.id][inp.dataset.q] = inp.value; else delete S.proof[set.id][inp.dataset.q];
        save();
      });
    });
  } else {
    const applyPick = (q,i)=>{
      document.querySelectorAll('.opt[data-q="'+q+'"]').forEach(x=>x.classList.remove("sel"));
      const lab = document.querySelector('.opt[data-q="'+q+'"][data-i="'+i+'"]');
      if(lab) lab.classList.add("sel");
      const card = document.getElementById('q-'+set.id+'-'+q);
      if(card) card.classList.remove("unanswered");
      paintBlank(set, q, i, 'filled');
    };
    Object.keys(picks).forEach(q=>applyPick(+q, picks[q]));
    updateCount();
    document.querySelectorAll('.opt:not(.locked)').forEach(lab=>{
      lab.addEventListener("click", ()=>{
        const q = +lab.dataset.q, i = +lab.dataset.i;
        picks[q] = i;
        applyPick(q,i);
        keep(); updateCount();
      });
    });
  }

  document.getElementById("submit").onclick = ()=>{
    const missing = qs.filter(q=>q.n!==0 && !(q.n in picks)).map(q=>q.n);
    if(missing.length){
      document.getElementById("setmsg").innerHTML =
        '<div class="note">You still have <b>'+missing.length+'</b> unanswered: ' + (bank ? 'gap ' : 'question ')
        + missing.join(", ") + '. Answer all ' + marksOf(set) + ' before submitting.'
        + (function(){ const pc = bank && PENCIL ? missing.filter(n=>candOf(set.id,n).length) : [];
             return pc.length ? '<br>\u270F\uFE0F Maybes are not answers. Tap a maybe again to answer ' + (pc.length>1 ? 'gaps ' : 'gap ') + pc.join(", ") + '.' : ''; })()
        + '</div>';
      missing.forEach(n=>{ const c = document.getElementById('q-'+set.id+'-'+n); if(c) c.classList.add("unanswered"); });
      const first = document.getElementById('q-'+set.id+'-'+missing[0]);
      if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    const answers = {}; let score = 0;
    qs.forEach(q=>{
      if(q.n===0) return;
      answers[q.n] = picks[q.n];
      if(picks[q.n] === q.key) score++;
    });
    S.sets[set.id] = { score:score, answers:answers };
    queueSet(set);
    if(S.draft) delete S.draft[set.id];
    save(); render(); window.scrollTo(0,0);
  };
}

function renderBanner(score, max){
  const f = max ? score/max : 0;
  const tone = f >= 0.8 ? "ok" : f >= 0.5 ? "mid" : "low";
  const msg = score === max ? "Perfect. Full marks \u2014 keep that momentum."
    : f >= 0.8 ? "Strong work. Read through the ones you missed before moving on."
    : f >= 0.5 ? "Decent. Check the green answers above and note why your choice did not fit."
    : "Tough one. Reread the passage around each red answer \u2014 the clue is always in the sentences before and after the gap.";
  document.getElementById("setmsg").innerHTML =
    '<div class="banner '+tone+'"><div class="big">'+score+' / '+max+'</div>'
    + '<div class="msg">'+msg+'</div></div>';
}

function renderFinal(){
  let total = 0;
  const rows = SETS.map(s=>{
    const r = S.sets[s.id] || {score:0};
    const m = marksOf(s);
    total += r.score;
    return '<tr><td><b>'+U+' '+s.id+'</b><br><span style="color:#5d6b7a;font-size:.85rem">'+esc(s.title)+'</span></td>'
         + '<td class="num">'+r.score+' / '+m+'</td>'
         + '<td class="num">'+Math.round(r.score/m*100)+'%</td></tr>';
  }).join("");
  const pct = Math.round(total/TOTAL*100);
  const grade = pct>=90?"A+":pct>=80?"A":pct>=70?"B":pct>=60?"C":pct>=50?"D":pct>=40?"E":"G";

  const wrong = [];
  SETS.forEach(s=>{
    const r = S.sets[s.id]; if(!r) return;
    QS(s).forEach(q=>{
      if(q.n===0) return;
      const p = r.answers[q.n];
      if(p !== q.key) wrong.push({set:s, n:q.n, picked:p, key:q.key, opts:q.opts, alt:(q.alt !== null && p === q.alt)});
    });
  });
  const nAlt = wrong.filter(w=>w.alt).length;
  const ans = (w,i,c) => isBank(w.set)
    ? '<span class="'+c+'">'+LTR[i]+'</span> <i>'+esc(w.opts[i])+'</i>'
    : '<span class="'+c+'">'+LTR[i]+' '+esc(w.opts[i])+'</span>';

  let html = '<div class="card narrow">'
    + '<span class="badge">Final report</span>'
    + '<h2 style="margin-top:8px">' + esc(CONFIG.reportTitle || "Practice \u2014 Result Slip") + '</h2>'
    + '<div class="idline"><div>Name: <b>'+esc(S.name)+'</b></div><div>Class: <b>'+esc(S.klass)+'</b></div>'
    + '<div>Date: <b>'+new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+'</b></div>'
    + '<div>BM support: <b>' + (S.support ? "on" : "off")
    + (unlockedCount() ? " \u00b7 " + unlockedCount() + " paragraph(s) translated" : "") + '</b></div></div>'
    + '<div class="banner '+(pct>=70?"ok":pct>=50?"mid":"low")+'" style="margin-top:18px">'
    + '<div class="big">'+total+' / '+TOTAL+' &nbsp;<span style="font-size:1rem;font-weight:600">('+pct+'% &middot; grade '+grade+')</span></div>'
    + '<div class="msg">'+(wrong.length===0 ? "Flawless \u2014 " + TOTAL + "/" + TOTAL + " across every " + U.toLowerCase() + "."
        : "You got "+wrong.length+" question"+(wrong.length>1?"s":"")+" wrong"
          + (nAlt ? " (" + nAlt + " of them defensible \u2014 check with your teacher)" : "")
          + ". The full list is below \u2014 copy them into your exercise book.")+'</div></div>'
    + '<h3>Marks by ' + U.toLowerCase() + '</h3>'
    + '<table><thead><tr><th>'+U+'</th><th class="num">Score</th><th class="num">%</th></tr></thead>'
    + '<tbody>'+rows+'<tr class="total"><td>TOTAL</td><td class="num">'+total+' / '+TOTAL+'</td>'
    + '<td class="num">'+pct+'%</td></tr></tbody></table>'
    + '<h3>Questions you got wrong ('+wrong.length+')</h3>';

  if(!wrong.length){
    html += '<div class="allright">No mistakes. Nothing to review \u2014 outstanding.</div>';
  } else {
    html += wrong.map(w =>
      '<div class="wrongitem">'
      + '<div class="wh">'+U+' '+w.set.id+' &middot; '+esc(w.set.title)+' &middot; Question '+w.n
      + (w.alt ? ' &middot; <span style="color:#9a6700">defensible</span>' : '') + '</div>'
      + '<div class="ctx">'+contextFor(w.set, w.n)+'</div>'
      + '<div class="cmp">Your answer: '+ans(w, w.picked, 'y')
      + (isBank(w.set) ? '<br>' : ' &nbsp;&rarr;&nbsp; ') + 'Correct answer: '+ans(w, w.key, 'c')+'</div>'
      + ((isBank(w.set) && PENCIL && candOf(w.set.id,w.n).length) ? '<div class="rpx">\u270F\uFE0F Your maybes: <b>' + candOf(w.set.id,w.n).map(i=>LTR[i]).join(", ") + '</b>'
          + (candOf(w.set.id,w.n).indexOf(w.key) > -1 ? ' (the key was one of them)' : ' (the key was not one of them)') + '</div>' : '')
      + ((isBank(w.set) && PROOF && proofOf(w.set.id,w.n)) ? '<div class="rpx">\uD83D\uDD0E Your proof: <i>' + esc(proofOf(w.set.id,w.n)) + '</i></div>' : '')
      + expBlock(w.set.id, w.n, w.picked, true)
      + '</div>').join("");
  }
  if(PROOF && HAS_BANK){
    const pr = [];
    SETS.forEach(s=>{
      const r = S.sets[s.id]; if(!r || !isBank(s)) return;
      QS(s).forEach(q=>{ if(q.n && proofOf(s.id,q.n)) pr.push({s:s, q:q, p:r.answers[q.n]}); });
    });
    if(pr.length){
      html += '<h3>Proof words (' + pr.length + ')</h3>'
        + '<p class="sub" style="margin:0 0 6px">The word or phrase you used to justify each answer. Not marked, but this is how you prove a Part 4 answer.</p>'
        + '<table class="prt"><thead><tr><th>' + U + '</th><th>Gap</th><th>Answer</th><th>Proof</th></tr></thead><tbody>'
        + pr.map(x=>'<tr><td>' + x.s.id + '</td><td>' + x.q.n + '</td><td><b class="' + (x.p === x.q.key ? 'pc' : 'py') + '">'
          + LTR[x.p] + (x.p === x.q.key ? ' \u2713' : ' \u00D7') + '</b></td><td><i>' + esc(proofOf(x.s.id,x.q.n)) + '</i></td></tr>').join("")
        + '</tbody></table>';
    }
  }

  html += '<div class="btnrow no-print">'
    + '<button id="printbtn">Print / Save as PDF</button>'
    + '<button class="ghost" id="review">Review a ' + U.toLowerCase() + '</button>'
    + '<button class="ghost" id="restart">Start over</button>'
    + '</div></div>';

  document.getElementById("app").innerHTML = html;
  document.getElementById("printbtn").onclick = ()=>{
    document.querySelectorAll("details").forEach(d=>d.open = true);
    window.print();
  };
  document.getElementById("review").onclick = ()=>{ S.done=false; S.idx=0; save(); render(); window.scrollTo(0,0); };
  document.getElementById("restart").onclick = ()=>{
    if(confirm("Clear all your answers and start again from " + U + " " + SETS[0].id + "?")){
      wipe();
      S = {studentId:S.studentId, attemptId:freshId(), receipts:{}, name:S.name, klass:S.klass, idx:0, sets:{}, done:false, support:S.support, unlocked:{}, draft:{}, pencil:{}, proof:{}, preview:{}, hl:{}};
      save(); render(); window.scrollTo(0,0);
    }
  };
}

/* ---------- v1.2 highlighter: words in the passage and the sentence bank ---------- */
const HL_SKIP = ".blk,.bmbtn,.bm,.omy,.ut,.bl,.qn";
function wrapWords(root, key){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(tw.nextNode()){
    const nd = tw.currentNode;
    if(nd.parentElement && nd.parentElement.closest(HL_SKIP)){ nodes.push(null); continue; }   /* break: never join across a gap */
    nodes.push(nd);
  }
  /* word numbers come from the plain text, so a word split by markup (e.g. a BM gloss
     before a comma) keeps one number and highlights survive switching BM on/off */
  let k = 0, joined = false;
  nodes.forEach(nd=>{
    if(!nd){ joined = false; return; }
    const frag = document.createDocumentFragment();
    const toks = nd.nodeValue.split(/(\s+)/).filter(Boolean);
    toks.forEach((tok, ti)=>{
      if(/^\s+$/.test(tok)){ frag.appendChild(document.createTextNode(tok)); joined = false; return; }
      const s = document.createElement("span");
      s.className = "w"; s.dataset.k = key;
      s.dataset.w = (ti === 0 && joined) ? k - 1 : k++;
      s.textContent = tok;
      frag.appendChild(s);
      joined = true;
    });
    nd.parentNode.replaceChild(frag, nd);
  });
}
function hlSetup(set){
  document.querySelectorAll("#app [data-hk]").forEach(el=>wrapWords(el, el.dataset.hk));
  const m = S.hl[set.id] || {};
  Object.keys(m).forEach(k=>(m[k] || []).forEach(w=>{
    document.querySelectorAll('#app .w[data-k="'+k+'"][data-w="'+w+'"]').forEach(s=>s.classList.add("hl"));
  }));
  const b = document.getElementById("hlclr");
  if(b){
    b.style.display = Object.keys(m).length ? "" : "none";
    b.onclick = ()=>{ delete S.hl[set.id]; save(); document.querySelectorAll("#app .w.hl").forEach(s=>s.classList.remove("hl")); b.style.display = "none"; };
  }
}
function hlStore(){
  const set = SETS[S.idx]; if(!set) return;
  const m = {};
  document.querySelectorAll("#app .w.hl").forEach(s=>{ const a = (m[s.dataset.k] = m[s.dataset.k] || []); if(a.indexOf(+s.dataset.w) < 0) a.push(+s.dataset.w); });
  if(Object.keys(m).length) S.hl[set.id] = m; else delete S.hl[set.id];
  save();
  const b = document.getElementById("hlclr"); if(b) b.style.display = Object.keys(m).length ? "" : "none";
}
let hlJust = 0;
function hlApply(){
  if(!HILITE) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  const hit = [...document.querySelectorAll("#app .w")].filter(s=>r.intersectsNode(s));
  if(!hit.length) return;
  hit.forEach(s=>document.querySelectorAll('#app .w[data-k="'+s.dataset.k+'"][data-w="'+s.dataset.w+'"]').forEach(x=>x.classList.add("hl")));
  sel.removeAllRanges();
  hlJust = Date.now();
  hlStore();
}
if(HILITE){
  document.addEventListener("mouseup", ()=>setTimeout(hlApply, 0));
  document.addEventListener("touchend", ()=>setTimeout(hlApply, 350));
  let hlT = null;
  document.addEventListener("selectionchange", ()=>{ clearTimeout(hlT); hlT = setTimeout(hlApply, 900); });  /* phone long-press */
  document.addEventListener("click", ev=>{
    const w = ev.target.closest && ev.target.closest(".w.hl");
    if(!w || Date.now() - hlJust < 400) return;
    ev.stopPropagation(); ev.preventDefault();
    /* tap a highlight: remove the whole highlighted phrase it belongs to */
    const k = w.dataset.k, at = +w.dataset.w;
    const get = i => [...document.querySelectorAll('#app .w[data-k="'+k+'"][data-w="'+i+'"]')];
    const on = i => get(i).some(s=>s.classList.contains("hl"));
    const off = i => get(i).forEach(s=>s.classList.remove("hl"));
    let i = at + 1; while(on(i)){ off(i); i++; }
    i = at - 1; while(i >= 0 && on(i)){ off(i); i--; }
    off(at);
    hlStore();
  }, true);
}

function render(){
  if(!S.studentId || !S.name || !S.klass) return renderStart();
  paintSync();
  if(S.done) return renderFinal();
  if(Object.keys(S.sets).length === SETS.length && S.idx >= SETS.length){ S.done = true; return renderFinal(); }
  renderSet();
}

document.getElementById("apptitle").textContent = CONFIG.appTitle;
document.getElementById("appsub").textContent = CONFIG.appSubtitle;
document.title = CONFIG.appTitle;

/* ---------- Malay word bubble ---------- */
document.body.insertAdjacentHTML("beforeend", '<div id="tip"></div>');
document.addEventListener("click", e=>{
  const tip = document.getElementById("tip");
  const g = e.target && e.target.closest ? e.target.closest(".gw") : null;
  if(g){
    e.preventDefault(); e.stopPropagation();
    tip.innerHTML = '<b>' + esc(g.textContent) + '</b> = ' + esc(g.dataset.m);
    tip.style.display = "block";
    const r = g.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let L = r.left + r.width/2 - w/2;
    L = Math.max(8, Math.min(L, window.innerWidth - w - 8));
    let T = r.top - h - 8;
    if(T < 8) T = r.bottom + 8;
    tip.style.left = L + "px"; tip.style.top = T + "px";
    return;
  }
  tip.style.display = "none";
}, true);

load(); installCloudBar(); render(); loadRoster(); if(outbox.length)flushQueue();
